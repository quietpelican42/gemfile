[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemfile"
version = "0.1.0"
description = "Static reader for Ruby Gemfiles that returns what Bundler's DSL would produce, without running Ruby."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "kofiadeyemiq"}]
keywords = ["gemfile", "bundler", "ruby", "rubygems", "sbom", "dependencies", "parser"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10"]

[project.scripts]
gemfile = "gemfile.cli:main"

[project.urls]
Repository = "https://github.com/quietpelican42/gemfile"

[tool.hatch.build.targets.wheel]
packages = ["src/gemfile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
strict = true
files = ["src", "tests", "scripts", "bench"]
mypy_path = "src:tests"
